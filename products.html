<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My E-Commerce • Products</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body data-page="products">
  <header class="site-header">
    <a class="brand" href="./index.html">My E-Commerce</a>
    <nav class="nav">
      <a class="active" href="./products.html">Products</a>
      <a href="./cart.html">Cart (<span id="cartCount">0</span>)</a>
    </nav>
  </header>

  <main class="container">
    <h1>Products</h1>

    <div class="controls">
      <input id="searchInput" class="input" type="search" placeholder="Search products..." />
      <select id="categorySelect" class="input">
        <option value="all">All categories</option>
      </select>
      <select id="sortSelect" class="input">
        <option value="featured">Featured</option>
        <option value="priceAsc">Price: Low → High</option>
        <option value="priceDesc">Price: High → Low</option>
        <option value="nameAsc">Name: A → Z</option>
      </select>
    </div>

    <div id="productsGrid" class="grid"></div>
  </main>

  <footer class="site-footer">
    <small>© <span id="year"></span> My E-Commerce</small>
  </footer>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>

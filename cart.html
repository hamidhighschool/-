<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarketNest • Cart</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body data-page="cart">
  <div class="top-strip">
    <div class="container top-strip__inner">
      <div class="top-strip__left"><span class="chip">USD</span><span class="chip">English</span></div>
      <div class="top-strip__right"><a href="./products.html" class="top-link">Continue shopping</a></div>
    </div>
  </div>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="./index.html"><span class="logo__mark">MN</span><span class="logo__text">MarketNest</span></a>
      <div class="header__crumbs"><span class="crumb">Cart</span></div>
      <a class="cart-pill" href="./cart.html"><span class="cart-pill__icon">🛒</span><span class="cart-pill__text">Cart</span><span class="cart-pill__count" id="cartCount">0</span></a>
    </div>
  </header>

  <main class="container cart">
    <section class="panel">
      <div class="panel__title">Your items</div>
      <div class="cart-list" id="cartItems"></div>
      <p class="muted small" style="padding:0 14px 14px">Demo cart uses localStorage.</p>
    </section>

    <aside class="panel cart__summary">
      <div class="panel__title">Summary</div>
      <div class="summary-row"><span class="muted">Subtotal</span><strong id="cartSubtotal">$0.00</strong></div>
      <div class="summary-row"><span class="muted">Shipping</span><strong>$0.00</strong></div>
      <div class="summary-row summary-row--total"><span>Total</span><strong id="cartTotal">$0.00</strong></div>
      <button class="btn btn--primary btn--block" id="checkoutBtn" type="button" style="margin:14px">Checkout (Demo)</button>
    </aside>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="muted">© <span id="year"></span> MarketNest</div>
    </div>
  </footer>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
